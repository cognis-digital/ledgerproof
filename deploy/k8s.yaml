apiVersion: apps/v1
kind: Deployment
metadata: { name: ledgerproof, labels: { app: ledgerproof } }
spec:
  replicas: 1
  selector: { matchLabels: { app: ledgerproof } }
  template:
    metadata: { labels: { app: ledgerproof } }
    spec:
      containers:
        - name: ledgerproof
          image: ghcr.io/cognis-digital/ledgerproof:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: ledgerproof }
spec:
  selector: { app: ledgerproof }
  ports: [{ port: 80, targetPort: 8000 }]
